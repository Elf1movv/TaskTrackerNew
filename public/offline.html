<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <title>MyTracker</title>
    <!-- Shown by sw.js when a page can't load without the internet. Self-contained:
         no fonts, scripts or styles from the network. Picks up the app's saved
         theme and language from localStorage. -->
    <style>
      :root {
        --bg: #0b1117;
        --card: #121a23;
        --fg: #e8edf2;
        --muted: #8a97a6;
        --border: #233140;
        --primary: #8fb3dd;
        --primary-fg: #0b1117;
      }
      :root.light {
        --bg: #f4f6f8;
        --card: #ffffff;
        --fg: #142231;
        --muted: #5d6b7a;
        --border: #dde3ea;
        --primary: #1c3049;
        --primary-fg: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        text-align: center;
        animation: rise 0.35s ease-out both;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" role="status">
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="title">Нет подключения к интернету</h1>
      <p id="text">MyTracker пока работает только онлайн. Страница откроется сама, как только связь вернётся.</p>
      <button id="retry" type="button">Повторить</button>
    </div>
    <!-- A separate file: the server's security policy blocks inline scripts. -->
    <script src="/offline.js"></script>
  </body>
</html>
