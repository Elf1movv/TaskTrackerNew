<!doctype html>
<!-- translate="no": the app has its own language switch. A browser
     translator rewrites text nodes under React and crashes it (2026-11-12). -->
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- viewport-fit=cover: the page may draw under the iPhone home-indicator
         area; the bottom nav pads itself with env(safe-area-inset-bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PWA (2026-11-12): installable app — manifest, home-screen icons. The
         theme color follows the app's theme at runtime (shared/lib/pwa). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyTracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>MyTracker</title>
    <meta
      name="description"
      content="Track tasks, goals, and daily progress efficiently to boost productivity and stay organized in personal and professional life."
    />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
      /* Splash (2026-11-15): drawn by the browser straight from this file,
         before any JS arrives, and removed by hideSplash() (shared/lib/splash)
         once the login check is done — instead of a black screen while the
         app loads. Dark like the app by default; splash-theme.js switches it
         to light for people who chose the light theme. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1117;
        color: #e6ecf2;
        font:
          600 17px/1.2 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.01em;
        transition: opacity 0.25s ease;
      }
      html[data-splash="light"] #splash {
        background: #f4f6f8;
        color: #16202b;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 76px;
        height: 76px;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      #splash span {
        opacity: 0.75;
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
    <script src="/splash-theme.js"></script>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="9" fill="#1c3049" />
        <svg
          x="7"
          y="7"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.25"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a9 9 0 1 1-6.2-8.56" />
          <path d="m8.5 11.5 3 3L22 4" />
        </svg>
      </svg>
      <span>MyTracker</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
