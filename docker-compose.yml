x-logging: &default-logging
  driver: json-file
  options:
    # Docker's json-file driver has no size limit by default — the log file
    # grows forever otherwise. Caps each container at 30MB total (3 files x
    # 10MB, oldest rotated out), plenty for a low-traffic personal app.
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/elf1movv/tasktracker:latest
    container_name: tasktracker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - server/.env
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasktracker-net

  db:
    image: postgres:16-bookworm
    container_name: tasktracker-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: tasktracker
      POSTGRES_DB: tasktracker
    env_file:
      - db.env
    volumes:
      - tasktracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktracker -d tasktracker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tasktracker-net

networks:
  tasktracker-net:
    name: tasktracker-net

volumes:
  tasktracker-db-data:
    name: tasktracker-db-data
